<body data-page="contact" data-base="../">
<header id="site-header"></header>

<main data-view="contact" class="contact-page">
  <div class="wrap">
    <div class="page-head reveal">
      <span class="eyebrow" data-ko="문의하기">Contact us</span>
      <h1 data-ko="연락하기">Get in Touch</h1>
      <p data-ko="궁금한 점이 있거나 아카이브에 기여하고 싶으신가요?<br>언제든 연락 주세요.">Have questions or want to contribute to our archive?<br>We'd love to hear from you.</p>
    </div>

    <div class="form-card reveal d1">
      <form id="contact-form" method="POST" enctype="multipart/form-data" action="https://formsubmit.co/bubble.youthimpact@gmail.com">
        <input type="hidden" name="_subject" value="New message from SoriArchive">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="">
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

        <div class="form-grid">
          <div class="field">
            <label for="c-name"><span data-ko="이름">Your Name</span> <span class="req">*</span></label>
            <input id="c-name" name="name" type="text" required autocomplete="name">
          </div>
          <div class="field">
            <label for="c-email"><span data-ko="이메일 주소">Email Address</span> <span class="req">*</span></label>
            <input id="c-email" name="email" type="email" required autocomplete="email">
          </div>
          <div class="field full">
            <label for="c-subject" data-ko="제목">Subject</label>
            <input id="c-subject" name="subject" type="text">
          </div>
          <div class="field full">
            <label for="c-message"><span data-ko="메시지">Message</span> <span class="req">*</span></label>
            <textarea id="c-message" name="message" required maxlength="2000"></textarea>
            <div class="char-count" id="c-count">0 / 2000</div>
          </div>
          <div class="field full">
            <label for="c-file" data-ko="파일 업로드">Upload File</label>
            <label class="drop" id="c-drop" for="c-file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
              <span id="c-fname" data-ko="클릭하거나 파일을 끌어다 놓으세요">Click to upload a file</span>
              <input id="c-file" name="attachment" type="file" accept="audio/*,image/*,.pdf,.doc,.docx,.txt">
            </label>
            <div class="hint" data-ko="음원, 사진, 문서 · 최대 5MB">Audio, photos or documents · up to 5 MB</div>
          </div>
        </div>
        <button class="btn send" type="submit" data-ko="메시지 보내기">Send message</button>
        <div class="form-note" id="form-note" hidden></div>
      </form>

      <div class="success" id="form-success" hidden>
        <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        <h2 data-ko="메시지가 전송되었습니다">Message sent</h2>
        <p data-ko="연락해 주셔서 감사합니다. 곧 답장 드리겠습니다.">Thank you for reaching out. We'll get back to you soon.</p>
        <a class="btn btn-ghost" href="../sounds/" data-route="sounds" data-ko="소리 둘러보기">Explore sounds</a>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="../assets/data.js"></script>
<script src="../assets/content.js"></script>
<script src="../assets/site.js"></script>
</body>
</html>
