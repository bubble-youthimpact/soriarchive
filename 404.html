<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · SoriArchive</title>
<script>
  /* 404.html is served at any depth, so find the site root first.
     Works for a custom domain ("/") and for username.github.io/repo/ ("/repo/"). */
  (function () {
    var seg = location.pathname.split("/").filter(Boolean)[0];
    var root = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
    window.SORI_ROOT = root;
    document.write('<base href="' + root + '">');
  })();
</script>
